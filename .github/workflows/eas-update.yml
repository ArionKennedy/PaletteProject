name: Publish Palette Android Update

on:
  pull_request:
    types: [closed]
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palette-android-production-update
  cancel-in-progress: false

jobs:
  update:
    # Only merged PRs publish automatically; closing a PR without merging does not.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Expo authentication is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Configure the repository EXPO_TOKEN secret before publishing.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate EAS production environment
        run: eas env:exec production 'npm run validate:release' --non-interactive
      - name: Publish Android OTA update
        run: eas update --platform android --channel production --environment production --message "master ${GITHUB_SHA}" --non-interactive
