name: Backend and Frontend Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend_tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: node --test 'tests/frontend/**/*.test.cjs'

  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/Palette.Tests.csproj

      - name: Run backend tests with coverage
        run: |
          dotnet test tests/Palette.Tests.csproj \
            --configuration Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverage.runsettings \
            --results-directory TestResults \
            --logger "trx;LogFileName=backend-tests.trx"

      - name: Generate coverage reports
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install \
            --tool-path "$RUNNER_TEMP/reportgenerator" \
            dotnet-reportgenerator-globaltool \
            --version 5.6.0

          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub"

      - name: Add coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/coverage-report/SummaryGithub.md') != '' }}
        run: |
          cat TestResults/coverage-report/SummaryGithub.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-and-coverage
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30
          