
services:
  postgres:
    image: postgres:17
    container_name: palette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: palette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: palette_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
